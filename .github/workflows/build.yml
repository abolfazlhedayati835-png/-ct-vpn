name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  # Job 1: compiles the real Xray networking core (Go) into an Android AAR.
  # This step downloads/compiles a large Go project so it naturally takes a while (~15-25 min).
  build-core:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build libv2ray.aar from AndroidLibXrayLite
        run: |
          git clone --depth=1 https://github.com/2dust/AndroidLibXrayLite core-src
          cd core-src
          gomobile init
          go mod tidy -v
          gomobile bind -v -androidapi 21 -ldflags='-s -w -checklinkname=0' ./
          mkdir -p "$GITHUB_WORKSPACE/core-out"
          cp libv2ray.aar "$GITHUB_WORKSPACE/core-out/"

      - name: Upload libv2ray.aar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: libv2ray-aar
          path: core-out/libv2ray.aar

  # Job 2: builds the actual Android app, using the aar produced above.
  build-app:
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download libv2ray.aar
        uses: actions/download-artifact@v4
        with:
          name: libv2ray-aar
          path: app/libs

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ct-vpn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
